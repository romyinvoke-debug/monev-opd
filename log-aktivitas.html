<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Aktivitas — SIMONEV</title>
    <meta name="description" content="Audit trail dan log aktivitas sistem - SIMONEV">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i class="fas fa-chart-line"></i>
                <span class="sidebar-brand">SIMONEV</span>
            </div>
            <button class="sidebar-close" id="sidebarClose"><i class="fas fa-times"></i></button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item" id="navDashboard"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="program.html" class="nav-item admin-only" id="navProgram"><i class="fas fa-clipboard-list"></i><span>Program & Kegiatan</span></a>
            <a href="input-realisasi.html" class="nav-item admin-only" id="navRealisasi"><i class="fas fa-edit"></i><span>Input Realisasi</span></a>
            <a href="laporan.html" class="nav-item" id="navLaporan"><i class="fas fa-file-alt"></i><span>Laporan</span></a>
            <a href="log-aktivitas.html" class="nav-item active admin-only" id="navLog"><i class="fas fa-history"></i><span>Log Aktivitas</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar"><i class="fas fa-user"></i></div>
                <div class="user-details">
                    <span class="user-name" id="userName">Loading...</span>
                    <span class="user-role" id="userRole">-</span>
                </div>
            </div>
            <button class="btn-logout" id="btnLogout"><i class="fas fa-sign-out-alt"></i><span>Keluar</span></button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <header class="top-header">
            <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
            <h1 class="page-title">Log Aktivitas</h1>
            <div class="header-right"><span class="current-date" id="currentDate"></span></div>
        </header>

        <div class="content-wrapper">
            <!-- Filters -->
            <div class="filter-bar">
                <div class="form-group">
                    <label class="form-label">Dari Tanggal</label>
                    <input type="date" class="form-input" id="filterDari">
                </div>
                <div class="form-group">
                    <label class="form-label">Sampai Tanggal</label>
                    <input type="date" class="form-input" id="filterSampai">
                </div>
                <div class="form-group">
                    <label class="form-label">Jenis Aksi</label>
                    <select class="form-select" id="filterAksi">
                        <option value="">Semua Aksi</option>
                        <option value="INSERT">INSERT</option>
                        <option value="UPDATE">UPDATE</option>
                        <option value="DELETE">DELETE</option>
                        <option value="EXPORT">EXPORT</option>
                        <option value="LOGIN">LOGIN</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="btnFilterLog">
                    <i class="fas fa-filter"></i> Filter
                </button>
            </div>

            <!-- Table -->
            <div class="glass-card">
                <div class="card-header">
                    <h3><i class="fas fa-shield-alt" style="margin-right:8px; color:var(--accent-amber)"></i>Riwayat Aktivitas Sistem</h3>
                    <span class="text-muted" id="logTotalInfo"></span>
                </div>
                <div class="table-container">
                    <table class="data-table" id="tabelLog">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Waktu</th>
                                <th>Pengguna</th>
                                <th>Aksi</th>
                                <th>Deskripsi</th>
                                <th>Tabel Terkait</th>
                            </tr>
                        </thead>
                        <tbody id="logBody">
                            <tr><td colspan="6"><div class="loading-spinner"><div class="spinner"></div></div></td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="logPagination" class="pagination"></div>
            </div>
        </div>
    </main>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/log.js"></script>
</body>
</html>
